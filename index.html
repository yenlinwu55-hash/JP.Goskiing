<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>東北雪國歷險記 ❄️｜旅遊手冊</title>
  
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon.png">
  <link rel="shortcut icon" href="icon.png">

  <style>
    :root {
      --primary: #0284c7;
      --primary-dark: #0369a1;
      --accent: #38bdf8;
      --bg-start: #e0f2fe;     /* 頂部冰雪藍 */
      --bg-end: #bae6fd;       /* 下方溫潤水藍漸層 */
      --card-bg: rgba(255, 255, 255, 0.92);
      --text-main: #0f172a;
      --text-sub: #475569;
      --radius: 22px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    
    body { 
      background: linear-gradient(180deg, var(--bg-start) 0%, var(--bg-end) 100%);
      background-attachment: fixed;
      color: var(--text-main); 
      padding-bottom: 60px;
      min-height: 100vh;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* 頂部封面卡片：比原版下移約 5 公分 (約 180px - 190px) */
    .hero-wrapper {
      margin-top: 180px; /* 下移約 5 公分 */
      margin-bottom: 14px;
    }

    .hero-card {
      position: relative;
      height: 240px;
      border-radius: var(--radius);
      background: url('watermarked_img_12792027685785638366.jpg') center 25% / cover no-repeat;
      box-shadow: 0 12px 30px rgba(2, 132, 199, 0.2);
      overflow: hidden;
      border: 1.5px solid rgba(255, 255, 255, 0.8);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    /* 右上角更換封面按鈕 */
    .change-cover-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 4px 10px;
      border-radius: 20px;
      color: white;
      font-size: 0.68rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      z-index: 2;
    }

    /* 左下角標題文字覆蓋區 */
    .hero-caption {
      background: linear-gradient(180deg, rgba(0, 0, 0, 0) 0%, rgba(15, 23, 42, 0.85) 100%);
      padding: 30px 14px 12px;
      color: white;
    }

    .hero-title {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 2px;
    }

    .hero-dates {
      font-size: 0.78rem;
      font-weight: 600;
      opacity: 0.95;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
    }

    .hero-locations {
      font-size: 0.72rem;
      opacity: 0.85;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
    }

    /* 水藍色 膠囊導航列 */
    .tab-nav-wrapper {
      position: sticky;
      top: 10px;
      z-index: 100;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 8px 10px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.9);
      overflow-x: auto;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.08);
    }
    .tab-nav-wrapper::-webkit-scrollbar { display: none; }

    .tab-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 7px 14px;
      border-radius: 20px;
      border: none;
      background: rgba(255, 255, 255, 0.85);
      color: #334155;
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 3px 8px rgba(2, 132, 199, 0.35);
    }

    /* 即時天氣預報卡片 (樣式完全符合預覽圖) */
    .weather-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 16px 14px 14px;
      margin-bottom: 16px;
      border: 1.5px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 6px 18px rgba(2, 132, 199, 0.06);
      text-align: center;
    }

    .weather-header-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--primary-dark);
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }

    .weather-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .weather-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 0.76rem;
    }

    .weather-icon {
      font-size: 1.6rem;
      margin-bottom: 4px;
    }

    .weather-city {
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 2px;
    }

    .weather-temp {
      font-weight: 700;
      color: var(--primary);
      font-size: 0.74rem;
    }

    .weather-condition {
      color: var(--text-sub);
      font-size: 0.7rem;
    }

    /* 每日行程天數膠囊 */
    .day-selector {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      margin-bottom: 12px;
      padding-bottom: 2px;
    }
    .day-selector::-webkit-scrollbar { display: none; }

    .day-chip {
      flex: 0 0 auto;
      padding: 6px 12px;
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 12px;
      text-align: center;
      cursor: pointer;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-sub);
    }
    .day-chip.active {
      background: var(--primary);
      color: #fff;
      font-weight: 800;
      box-shadow: 0 2px 6px rgba(2, 132, 199, 0.25);
    }

    /* 行程白底卡片 */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 6px 18px rgba(2, 132, 199, 0.05);
      border: 1.5px solid rgba(255, 255, 255, 0.9);
    }

    .card-badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 800;
      color: #e11d48;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 14px;
    }

    /* 時間軸 */
    .timeline {
      position: relative;
      padding-left: 26px;
    }
    .timeline::before {
      content: '';
      position: absolute;
      left: 10px;
      top: 6px;
      bottom: 6px;
      width: 2px;
      background: #bae6fd;
    }

    .t-item {
      position: relative;
      margin-bottom: 20px;
    }
